server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/custody
    username: custody_app
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    com.bank.custody: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

fireblocks:
  basePath: ${FIREBLOCKS_BASE_PATH:http://localhost:9561}
  apiKey: ${FIREBLOCKS_API_KEY:}
  secretKey: ${FIREBLOCKS_SECRET_KEY:}
  privateKeyPath: ${FIREBLOCKS_PRIVATE_KEY_PATH:}
  webhook:
    signingSecret: ${FIREBLOCKS_WEBHOOK_SIGNING_SECRET:}
    publicKeyPath: ${FIREBLOCKS_WEBHOOK_PUBLIC_KEY_PATH:}
    verificationMethod: ${FIREBLOCKS_WEBHOOK_VERIFICATION_METHOD:HMAC_SHA256}

outbox:
  queue-name: ${OUTBOX_QUEUE_NAME:outbox-events}

messaging:
  mode: ${MESSAGING_MODE:local}
  servicebus:
    connection-string: ${SERVICEBUS_CONNECTION_STRING:}

security:
  local-jwt:
    token: ${LOCAL_JWT_TOKEN:local-dev-token}

assets:
  allow-list:
    - BTC
    - ETH
    - USDC
