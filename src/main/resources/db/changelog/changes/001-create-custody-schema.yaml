databaseChangeLog:
  - changeSet:
      id: 001-create-custody-schema
      author: custody-mvp
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE custody_account (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                external_customer_id VARCHAR(255) NOT NULL UNIQUE,
                name VARCHAR(255) NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE TABLE asset (
                asset_id VARCHAR(64) PRIMARY KEY,
                display_name VARCHAR(255) NOT NULL,
                network VARCHAR(128) NOT NULL,
                enabled BOOLEAN NOT NULL DEFAULT true
              );
              CREATE TABLE wallet_mapping (
                id VARCHAR(255) PRIMARY KEY,
                account_id BIGINT NOT NULL REFERENCES custody_account(id),
                asset_id VARCHAR(64) NOT NULL REFERENCES asset(asset_id),
                provider_vault_id VARCHAR(255) NOT NULL,
                provider_wallet_id VARCHAR(255),
                blockchain_address VARCHAR(500)
              );
              CREATE TABLE ledger_entry (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                account_id BIGINT NOT NULL REFERENCES custody_account(id),
                asset_id VARCHAR(64) NOT NULL REFERENCES asset(asset_id),
                amount NUMERIC(38,18) NOT NULL,
                type VARCHAR(16) NOT NULL,
                metadata TEXT,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE TABLE custody_transaction (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                account_id BIGINT NOT NULL REFERENCES custody_account(id),
                asset_id VARCHAR(64) NOT NULL REFERENCES asset(asset_id),
                direction VARCHAR(16) NOT NULL,
                amount NUMERIC(38,18) NOT NULL,
                external_provider_tx_id VARCHAR(255),
                created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                idempotency_key VARCHAR(200) UNIQUE,
                status VARCHAR(50)
              );
              CREATE TABLE position (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                account_id BIGINT NOT NULL REFERENCES custody_account(id),
                asset_id VARCHAR(64) NOT NULL REFERENCES asset(asset_id),
                available NUMERIC(38,18) NOT NULL DEFAULT 0,
                locked NUMERIC(38,18) NOT NULL DEFAULT 0,
                pending NUMERIC(38,18) NOT NULL DEFAULT 0,
                version BIGINT NOT NULL DEFAULT 0,
                created_at TIMESTAMPTZ DEFAULT now(),
                updated_at TIMESTAMPTZ DEFAULT now(),
                UNIQUE(account_id, asset_id)
              );
              CREATE TABLE provider_event (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                provider VARCHAR(100) NOT NULL,
                provider_event_id VARCHAR(255) NOT NULL,
                event_type VARCHAR(200),
                payload JSONB,
                received_at TIMESTAMPTZ DEFAULT now(),
                processed BOOLEAN NOT NULL DEFAULT false,
                processed_at TIMESTAMPTZ,
                UNIQUE(provider, provider_event_id)
              );
              CREATE TABLE outbox_event (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                aggregate_type VARCHAR(200),
                aggregate_id VARCHAR(200),
                type VARCHAR(200),
                payload JSONB,
                processed BOOLEAN NOT NULL DEFAULT false,
                attempts INTEGER NOT NULL DEFAULT 0,
                next_attempt_at TIMESTAMPTZ,
                created_at TIMESTAMPTZ DEFAULT now()
              );
              CREATE TABLE dead_letter (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                source_type VARCHAR(255),
                source_id VARCHAR(255),
                payload TEXT,
                reason TEXT,
                created_at TIMESTAMPTZ DEFAULT now()
              );
              CREATE TABLE audit_event (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                action VARCHAR(255),
                aggregate_id VARCHAR(255),
                details TEXT,
                created_at TIMESTAMPTZ DEFAULT now()
              );
              CREATE TABLE reconciliation_result (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                asset_id VARCHAR(64),
                network VARCHAR(128),
                status VARCHAR(50),
                details TEXT,
                created_at TIMESTAMPTZ DEFAULT now()
              );
